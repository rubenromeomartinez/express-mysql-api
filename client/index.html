<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Items</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
        }

        /* Card del Formulario */
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-save { background-color: var(--primary); color: white; }
        .btn-save:hover { background-color: var(--primary-dark); }
        
        .btn-cancel { 
            background-color: transparent; 
            color: var(--secondary); 
            margin-top: 10px;
            text-decoration: underline;
        }

        /* Buscador */
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary);
        }

        .search-container input {
            padding-left: 45px;
            background-color: white;
            border-width: 2px;
        }

        /* Lista de Items */
        .item-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f1f5f9;
            transition: 0.2s;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        .item-info h4 { margin: 0; color: var(--text); }
        .item-info p { margin: 4px 0 0; color: var(--secondary); font-size: 0.9rem; }

        .actions { display: flex; gap: 8px; }

        .btn-action {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .edit-bg { background-color: #fef3c7; color: var(--warning); }
        .edit-bg:hover { background-color: var(--warning); color: white; }

        .delete-bg { background-color: #fee2e2; color: var(--danger); }
        .delete-bg:hover { background-color: var(--danger); color: white; }

        .empty-state { text-align: center; padding: 40px; color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-boxes-stacked" style="color: var(--primary);"></i> Inventario Pro</h2>
    </div>

    <div class="card">
        <form id="crudForm">
            <input type="hidden" id="itemId">
            <div class="form-group">
                <input type="text" id="name" placeholder="Nombre del producto" required>
            </div>
            <div class="form-group">
                <textarea id="description" placeholder="Descripción detallada..." rows="3"></textarea>
            </div>
            <button type="submit" id="mainBtn" class="btn btn-save">
                <i class="fas fa-plus"></i> Guardar Registro
            </button>
            <button type="button" id="cancelBtn" class="btn btn-cancel" style="display: none;">
                Cancelar edición
            </button>
        </form>
    </div>

    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar por nombre o descripción...">
    </div>

    <div id="itemsContainer">
        </div>
</div>

<script>
    // --- CONFIGURACIÓN DE URL INTELIGENTE ---
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    // Reemplaza esta URL con la que te asigne Railway para tu servicio API
    const PROD_URL = 'https://express-mysql-api.railway.internal/api/items';
    const LOCAL_URL = 'http://localhost:3000/api/items';
    
    const API_URL = isLocal ? LOCAL_URL : PROD_URL;

    const form = document.getElementById('crudForm');
    const itemsContainer = document.getElementById('itemsContainer');
    const searchInput = document.getElementById('searchInput');
    const mainBtn = document.getElementById('mainBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    // --- 1. LEER (READ) Y BUSCAR ---
    async function loadItems(query = '') {
        try {
            const url = query ? `${API_URL}?q=${encodeURIComponent(query)}` : API_URL;
            const res = await fetch(url);
            const data = await res.json();
            renderItems(data);
        } catch (err) {
            console.error("Error cargando datos:", err);
            itemsContainer.innerHTML = '<p class="empty-state">Error al conectar con la API.</p>';
        }
    }

    function renderItems(data) {
        if (data.length === 0) {
            itemsContainer.innerHTML = '<p class="empty-state">No hay registros que coincidan.</p>';
            return;
        }
        itemsContainer.innerHTML = data.map(item => `
            <div class="item-card">
                <div class="item-info">
                    <h4>${item.name}</h4>
                    <p>${item.description || 'Sin descripción'}</p>
                </div>
                <div class="actions">
                    <button class="btn-action edit-bg" title="Editar" 
                            onclick="prepareEdit(${item.id}, '${item.name}', '${item.description}')">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="btn-action delete-bg" title="Eliminar" 
                            onclick="deleteItem(${item.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    // --- 2. CREAR (POST) / ACTUALIZAR (PUT) ---
    form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('itemId').value;
        const payload = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value
        };

        const config = {
            method: id ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        };

        try {
            const res = await fetch(id ? `${API_URL}/${id}` : API_URL, config);
            if (res.ok) {
                resetForm();
                loadItems();
            }
        } catch (err) {
            alert("Error al guardar.");
        }
    };

    // --- 3. ELIMINAR (DELETE) ---
    async function deleteItem(id) {
        if (confirm('¿Eliminar este registro permanentemente?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadItems();
        }
    }

    // --- FUNCIONES DE APOYO ---
    window.prepareEdit = (id, name, desc) => {
        document.getElementById('itemId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('description').value = desc;
        mainBtn.innerHTML = '<i class="fas fa-sync"></i> Actualizar Registro';
        mainBtn.style.backgroundColor = 'var(--warning)';
        cancelBtn.style.display = 'inline-flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetForm() {
        form.reset();
        document.getElementById('itemId').value = '';
        mainBtn.innerHTML = '<i class="fas fa-plus"></i> Guardar Registro';
        mainBtn.style.backgroundColor = 'var(--primary)';
        cancelBtn.style.display = 'none';
    }

    searchInput.addEventListener('input', (e) => loadItems(e.target.value));
    cancelBtn.onclick = resetForm;

    // Carga inicial
    loadItems();
</script>

</body>
</html>
